# Course cluster: 1 control-plane + 2 workers.
# Ports 80/443 on the control-plane node are published on localhost so that the
# ingress controller installed in Lab 07 is reachable at http://localhost.
#   kind create cluster --name pinboard --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pinboard
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
